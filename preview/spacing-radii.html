<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-page);}
.card{padding:18px 28px;color:var(--ink);display:flex;align-items:center;gap:30px}
.swatches{display:flex;gap:8px}
.r{border-radius:var(--r);width:64px;height:64px;background:var(--maroon);display:flex;align-items:center;justify-content:center;font-family:var(--font-utility);font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cream)}
.lbl{font-family:var(--font-utility);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);text-align:center;margin-top:6px;font-weight:500}
.col{display:flex;flex-direction:column;align-items:center}
</style></head>
<body><div class="card">
  <div class="col"><div class="r" style="--r:4px">4</div><div class="lbl">XS · inputs</div></div>
  <div class="col"><div class="r" style="--r:6px">6</div><div class="lbl">SM · cards</div></div>
  <div class="col"><div class="r" style="--r:8px">8</div><div class="lbl">MD · modal</div></div>
  <div class="col"><div class="r" style="--r:999px">∞</div><div class="lbl">Pill · btn</div></div>
  <div style="font-family:var(--font-body);font-size:.85rem;color:var(--ink-soft);max-width:24ch;font-style:italic;line-height:1.5">Subtle radii. Never sharp, never heavy. Pill for action, small radii for surface.</div>
</div></body></html>
