<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-page);font-family:var(--font-body);color:var(--ink);}
.card{padding:24px 28px;display:flex;flex-direction:column;gap:14px;}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.swatch{width:120px;height:96px;border-radius:6px;display:flex;align-items:flex-end;padding:10px;font-family:var(--font-utility);font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;}
.lbl{font-family:var(--font-utility);font-size:.62rem;letter-spacing:.04em;text-transform:none;line-height:1.4}
.lbl b{display:block;letter-spacing:.18em;text-transform:uppercase;font-size:.6rem;font-weight:500}
</style></head>
<body>
<div class="card">
<div class="row">
  <div class="swatch" style="background:#4A1A2C;color:#F2E9D8;"><span>#4A1A2C</span></div>
  <div class="swatch" style="background:#3A1320;color:#F2E9D8;"><span>#3A1320</span></div>
  <div class="swatch" style="background:#2A0F1A;color:#F2E9D8;"><span>#2A0F1A</span></div>
  <div class="swatch" style="background:#0d0408;color:#F2E9D8;"><span>#0d0408</span></div>
</div>
<div class="row" style="gap:38px">
  <div class="lbl"><b>Maroon</b>--maroon · primary surface</div>
  <div class="lbl"><b>Maroon Deep</b>--maroon-deep</div>
  <div class="lbl"><b>Maroon Deeper</b>--maroon-deeper</div>
  <div class="lbl"><b>Maroon Night</b>--maroon-night</div>
</div>
</div></body></html>
