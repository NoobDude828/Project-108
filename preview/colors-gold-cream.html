<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-page);font-family:var(--font-body);color:var(--ink);}
.card{padding:24px 28px;display:flex;flex-direction:column;gap:14px;}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.swatch{width:120px;height:96px;border-radius:6px;display:flex;align-items:flex-end;padding:10px;font-family:var(--font-utility);font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;}
.lbl{font-family:var(--font-utility);font-size:.62rem;letter-spacing:.04em;line-height:1.4}
.lbl b{display:block;letter-spacing:.18em;text-transform:uppercase;font-size:.6rem;font-weight:500}
</style></head>
<body>
<div class="card">
<div class="row">
  <div class="swatch" style="background:#C8A663;color:#2A0F1A;"><span>#C8A663</span></div>
  <div class="swatch" style="background:#D4B373;color:#2A0F1A;"><span>#D4B373</span></div>
  <div class="swatch" style="background:#E2C788;color:#2A0F1A;"><span>#E2C788</span></div>
  <div class="swatch" style="background:#F2E9D8;color:#4A1A2C;border:1px solid rgba(74,26,44,.12)"><span>#F2E9D8</span></div>
  <div class="swatch" style="background:#FAF6ED;color:#4A1A2C;border:1px solid rgba(74,26,44,.12)"><span>#FAF6ED</span></div>
</div>
<div class="row" style="gap:30px">
  <div class="lbl"><b>Gold</b>--gold</div>
  <div class="lbl"><b>Gold Bright</b>--gold-bright</div>
  <div class="lbl"><b>Gold Warm</b>--gold-warm</div>
  <div class="lbl"><b>Cream</b>--cream</div>
  <div class="lbl"><b>Cream Light</b>--cream-light</div>
</div>
</div></body></html>
