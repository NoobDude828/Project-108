<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-page);}
.card{padding:18px 24px;display:flex;align-items:center;gap:18px}
.fig{background:#FAF6ED;border:1px solid rgba(74,26,44,.10);border-radius:6px;padding:14px 18px;display:flex;align-items:flex-end;gap:18px;flex:1;min-height:180px;justify-content:center}
.fig img{display:block}
.lbl{font-family:var(--font-utility);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);max-width:18ch;font-weight:500;line-height:1.5}
.lbl b{display:block;color:var(--maroon);letter-spacing:.18em;margin-bottom:.3em}
</style></head>
<body><div class="card">
<div class="fig"><img src="../assets/scale_figures.svg" height="160" alt="Scale figures"></div>
<div class="lbl"><b>Diagrams</b>Vectors extracted from the print brochure. Always paired with utility microcaptions.</div>
</div></body></html>
