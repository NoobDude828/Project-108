<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-page);}
.card{padding:22px 28px;color:var(--ink);display:flex;flex-direction:column;gap:10px;}
.h1{font-family:var(--font-display);font-weight:400;font-size:2.4rem;line-height:1.12;color:var(--maroon);margin:0;font-feature-settings:"onum"}
.h2{font-family:var(--font-display);font-weight:400;font-size:1.7rem;line-height:1.15;color:var(--maroon);margin:0}
.h3{font-family:var(--font-display);font-weight:400;font-size:1.25rem;line-height:1.2;color:var(--maroon);margin:0}
.lede{font-family:var(--font-display);font-style:italic;font-size:1.15rem;line-height:1.4;color:var(--ink);margin:0;max-width:36ch}
.tag{font-family:var(--font-utility);font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin-left:.6em}
em{font-style:italic;color:var(--gold)}
</style></head>
<body><div class="card">
<div class="h1">A sacred gesture <em>of peace</em><span class="tag">H1 · 38px</span></div>
<div class="h2">What exactly is being built?<span class="tag">H2 · 27px</span></div>
<div class="h3">Begin the conversation<span class="tag">H3 · 20px</span></div>
<div class="lede">Project 108 is shaped by two forces: those who offer the chortens and those who build them.<span class="tag">Lede · italic display</span></div>
</div></body></html>
