<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-page);}
.card{padding:22px 28px;display:flex;gap:18px;flex-wrap:wrap;color:var(--ink)}
.tile{background:var(--cream);border-radius:6px;padding:1.4rem 1.5rem;flex:1;min-width:200px}
.badge{font-family:var(--font-utility);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:.6rem;font-weight:500}
.title{font-family:var(--font-display);font-size:1.4rem;color:var(--maroon);text-transform:uppercase;letter-spacing:.02em;line-height:1.1;margin:0 0 .55rem;font-weight:500}
.body{color:var(--ink);font-size:.9rem;line-height:1.55;margin:0;font-family:var(--font-body)}
</style></head>
<body><div class="card">
<div class="tile"><div class="badge">Confirmed</div><h3 class="title">Site</h3><p class="body">The site stretches over 12 km along the Mau Chhu.</p></div>
<div class="tile"><div class="badge">Underway</div><h3 class="title">Engineering</h3><p class="body">Technical planning and foundation preparation are already active.</p></div>
</div></body></html>
