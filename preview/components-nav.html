<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:#FAF6ED;}
.card{padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px;color:var(--ink);background:rgba(250,246,237,.92);backdrop-filter:saturate(120%) blur(8px);border-bottom:1px solid rgba(74,26,44,.15)}
.brand{font-family:var(--font-display);font-size:1.3rem;color:var(--maroon);text-decoration:none;letter-spacing:.02em;line-height:1}
.brand small{font-family:var(--font-utility);font-size:.6rem;letter-spacing:.25em;text-transform:uppercase;display:block;color:var(--ink-soft);margin-bottom:2px;font-weight:500}
.links{list-style:none;display:flex;gap:1.4rem;margin:0;padding:0}
.links a{font-family:var(--font-utility);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:var(--ink-soft);font-weight:500}
.links a.on{color:var(--maroon)}
.cta{font-family:var(--font-utility);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--cream);background:var(--maroon);padding:.55rem .9rem;border-radius:999px;text-decoration:none;font-weight:500}
</style></head>
<body><div class="card">
<a class="brand"><small>Project</small>108</a>
<ul class="links"><li><a class="on">The Project</a></li><li><a>The Chorten</a></li><li><a>Scale</a></li><li><a>Take Part</a></li></ul>
<a class="cta">Take Part</a>
</div></body></html>
