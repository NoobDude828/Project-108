<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-page);}
.card{padding:24px 28px;display:flex;align-items:center;gap:30px}
.modal{width:200px;height:120px;background:#FAF6ED;border-radius:8px;box-shadow:0 30px 60px rgba(45,20,25,0.4);padding:14px 16px;font-family:var(--font-display);color:var(--maroon);font-size:.95rem;display:flex;flex-direction:column;justify-content:flex-end}
.modal small{font-family:var(--font-utility);font-size:.55rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;font-weight:500}
.glow{width:160px;height:120px;background:#2A0F1A;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:italic;font-weight:300;font-size:4rem;color:var(--gold);text-shadow:0 0 80px rgba(200,166,99,.45);font-feature-settings:"onum"}
.lbl{font-family:var(--font-utility);font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);max-width:18ch;line-height:1.5;font-weight:500}
</style></head>
<body><div class="card">
  <div><div class="modal"><small>Modal · elevation</small><div>Begin the<br>Conversation</div></div><div class="lbl" style="text-align:center;margin-top:10px">0 30px 60px rgba(45,20,25,.4)</div></div>
  <div><div class="glow">108</div><div class="lbl" style="text-align:center;margin-top:10px">text-shadow 80px gold glow</div></div>
  <div class="lbl" style="font-style:italic;font-family:var(--font-body);font-size:.85rem;letter-spacing:0;text-transform:none;color:var(--ink-soft);max-width:22ch">UI is otherwise flat. Cards sit on the page by colour difference alone.</div>
</div></body></html>
