<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-page);}
.card{padding:22px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;color:var(--ink)}
.btn{display:inline-block;padding:.875rem 1.75rem;font-family:var(--font-utility);font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;border-radius:999px;cursor:pointer;border:0;transition:background .2s, color .2s, transform .1s;text-decoration:none;font-weight:500}
.primary{background:var(--maroon);color:var(--cream)}
.primary:hover{background:var(--maroon-deep)}
.ghost{background:transparent;color:var(--maroon);border:1px solid var(--maroon)}
.ghost:hover{background:var(--maroon);color:var(--cream)}
.cta{background:var(--maroon);color:var(--cream);padding:.625rem 1rem;font-size:.75rem;letter-spacing:.18em}
.lbl{font-family:var(--font-utility);font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;margin-top:6px;display:block;text-align:center}
.col{display:flex;flex-direction:column;align-items:center}
</style></head>
<body><div class="card">
<div class="col"><a class="btn primary">Become a Patron</a><span class="lbl">Primary</span></div>
<div class="col"><a class="btn ghost">Download Brochure</a><span class="lbl">Ghost</span></div>
<div class="col"><a class="btn cta">Take Part</a><span class="lbl">Nav CTA</span></div>
</div></body></html>
