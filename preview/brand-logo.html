<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-page);}
.card{padding:24px 32px;display:flex;align-items:center;gap:36px;color:var(--ink)}
.mark{display:flex;flex-direction:column;align-items:center;line-height:1}
.mark small{font-family:var(--font-utility);font-size:.65rem;letter-spacing:.5em;text-transform:uppercase;color:var(--maroon);margin-bottom:8px;font-weight:500}
.mark .num{font-family:var(--font-display);font-style:italic;font-weight:300;font-size:5.4rem;color:var(--maroon);font-feature-settings:"onum";letter-spacing:-.02em}
.mark.dark{background:var(--maroon);padding:18px 28px;border-radius:6px}
.mark.dark small{color:var(--gold)}
.mark.dark .num{color:var(--gold);font-weight:300}
.lbl{font-family:var(--font-utility);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);max-width:14ch;line-height:1.5;font-weight:500}
</style></head>
<body><div class="card">
<div class="mark"><small>Project</small><span class="num">108</span></div>
<div class="mark dark"><small>Project</small><span class="num">108</span></div>
<div class="lbl">The brand mark.<br>No wordmark — the stacked numeral is the logo.</div>
</div></body></html>
