<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-page);}
.card{padding:22px 28px;color:var(--ink);display:flex;flex-direction:column;gap:14px;}
.row{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.eb{font-family:var(--font-utility);font-weight:500;text-transform:uppercase;color:var(--maroon);}
.eb.gold{color:var(--gold)}
.eb.cream-bg{background:#4A1A2C;color:#C8A663;padding:6px 10px;border-radius:999px}
.note{font-family:var(--font-body);font-size:.78rem;color:var(--ink-soft);margin-left:auto}
</style></head>
<body><div class="card">
<div class="row"><span class="eb" style="font-size:.625rem;letter-spacing:.18em">An Invitation</span><span class="note">tight 0.18em · 10px</span></div>
<div class="row"><span class="eb" style="font-size:.75rem;letter-spacing:.22em">The Project</span><span class="note">default 0.22em · 12px</span></div>
<div class="row"><span class="eb gold" style="font-size:.75rem;letter-spacing:.32em">Take Part</span><span class="note">wide 0.32em · gold</span></div>
<div class="row"><span class="eb" style="font-size:.7rem;letter-spacing:.5em">Project</span><span class="note">xwide 0.5em · paired with the 108 numeral</span></div>
<div class="row"><span class="eb cream-bg" style="font-size:.75rem;letter-spacing:.22em">Become a Patron</span><span class="note">button label</span></div>
</div></body></html>
