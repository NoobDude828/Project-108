<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-page);}
.card{padding:24px 28px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.eb{font-family:var(--font-utility);font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:500}
.q{font-family:var(--font-display);font-style:italic;font-weight:300;font-size:1.6rem;line-height:1.32;color:var(--maroon);margin:.4rem 0 0;max-width:32ch;text-wrap:balance}
.q em{color:var(--gold);font-style:italic}
.attr{font-family:var(--font-utility);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);margin-top:.9rem;font-weight:500}
.attr .who{color:var(--maroon)}
</style></head>
<body><div class="card">
<div class="eb">A Royal Initiative</div>
<p class="q">"There is no limit to what we can achieve when we <em>stand together</em>."</p>
<div class="attr"><span class="who">His Majesty Jigme Khesar Namgyel Wangchuck</span> · 21 February 2026</div>
</div></body></html>
