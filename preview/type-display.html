<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-page);}
.card{padding:28px 32px;display:flex;flex-direction:column;gap:6px;color:var(--ink);}
.specimen{font-family:var(--font-display);font-weight:300;color:var(--maroon);line-height:.95;font-feature-settings:"onum";letter-spacing:-0.01em;margin:0}
.it{font-style:italic;color:var(--gold)}
.meta{font-family:var(--font-utility);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px}
</style></head>
<body><div class="card">
<p class="specimen" style="font-size:6rem;">Aa <span class="it">108</span></p>
<p class="meta">Cormorant Garamond Light · 300 / 400 · oldstyle figures · italic for emphasis · headlines &amp; numerals</p>
</div></body></html>
