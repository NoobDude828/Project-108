<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:#FAF6ED;}
.card{padding:14px 20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(74,26,44,.15);border-bottom:1px solid rgba(74,26,44,.15)}
.s{padding:1.4rem .8rem;text-align:center;border-right:1px solid rgba(74,26,44,.15)}
.s:last-child{border-right:0}
.v{font-family:var(--font-display);font-size:2rem;line-height:1;color:var(--maroon);font-feature-settings:"onum";margin-bottom:.4rem;font-weight:400}
.l{font-family:var(--font-utility);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);font-weight:500}
</style></head>
<body><div class="card"><div class="stats">
<div class="s"><div class="v">108</div><div class="l">Chortens</div></div>
<div class="s"><div class="v">15 m</div><div class="l">Height</div></div>
<div class="s"><div class="v">108 m</div><div class="l">Spacing</div></div>
<div class="s"><div class="v">1.62 km</div><div class="l">Stacked</div></div>
</div></div></body></html>
