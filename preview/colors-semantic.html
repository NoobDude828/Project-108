<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-page);font-family:var(--font-body);color:var(--ink);}
.card{padding:24px 28px;display:flex;flex-direction:column;gap:18px;}
.pair{display:flex;gap:24px;align-items:center}
.tile{flex:1;padding:16px 18px;border-radius:6px;display:flex;flex-direction:column;gap:8px;min-height:96px;justify-content:center}
.t-name{font-family:var(--font-utility);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.t-sample{font-family:var(--font-display);font-size:1.3rem;line-height:1.1;font-weight:400}
.t-sub{font-family:var(--font-body);font-size:.85rem;}
</style></head>
<body>
<div class="card">
  <div class="pair">
    <div class="tile" style="background:#FAF6ED;color:#2D1419;"><span class="t-name" style="color:#4A1A2C">FG-1 / INK on cream</span><span class="t-sample">Aa Bb 108</span><span class="t-sub" style="color:#5A3640">FG-2 muted body — secondary text</span></div>
    <div class="tile" style="background:#4A1A2C;color:#F2E9D8;"><span class="t-name" style="color:#C8A663">FG-1 / Cream on maroon</span><span class="t-sample">Aa Bb 108</span><span class="t-sub" style="color:rgba(242,233,216,.78)">FG-2 78% — secondary on dark</span></div>
  </div>
  <div class="pair">
    <div class="tile" style="background:#F2E9D8;color:#4A1A2C;"><span class="t-name">Cream surface</span><span class="t-sub">Card surface on lighter cream page (no shadow, color difference only)</span></div>
    <div class="tile" style="background:#3A1320;color:#C8A663;"><span class="t-name" style="color:#D4B373">Accent on dark</span><span class="t-sub" style="color:rgba(242,233,216,.55)">Gold accents — numerals, eyebrows, highlights</span></div>
  </div>
</div></body></html>
