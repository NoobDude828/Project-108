<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-page);}
.card{padding:24px 28px;display:flex;align-items:center;gap:32px;color:var(--ink)}
.box{background:white;border:1px solid rgba(74,26,44,0.15);padding:14px 18px;font-family:var(--font-utility);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);min-width:120px;text-align:center}
.box.dark{background:#4A1A2C;color:rgba(242,233,216,.75);border-color:rgba(242,233,216,0.18)}
.hr{width:160px;text-align:center;font-family:var(--font-body);color:var(--ink-soft);font-size:.85rem;font-style:italic}
.hr::before{content:"";display:block;margin:0 auto 6px;width:36px;height:1px;background:var(--gold)}
</style></head>
<body><div class="card">
  <div class="box">Hairline on cream<br><span style="text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:.78rem;color:var(--ink)">1px · rgba(74,26,44,.15)</span></div>
  <div class="box dark">Hairline on dark<br><span style="text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:.78rem;color:#F2E9D8">1px · rgba(242,233,216,.18)</span></div>
  <div class="hr">36×1 gold rule<br>(divider motif)</div>
</div></body></html>
