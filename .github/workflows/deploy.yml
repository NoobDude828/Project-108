name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/Project-108
            git fetch origin && git reset --hard origin/main
            # Install first: a commit that adds a dependency (e.g. pg) would
            # otherwise fail the build, and because `pm2 restart` still ran, the
            # app came back up with no .next directory and served 502s.
            npm install --no-audit --no-fund
            # `set -e` aborts here on a bad build, leaving the previous (working)
            # .next in place and the running process untouched.
            npm run build
            pm2 restart project-108
