<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project 108 — Website UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css" />
<link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
<div id="root" class="p108 p108-page"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="svg-inline.js"></script>

<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="StatStrip.jsx"></script>
<script type="text/babel" src="Section.jsx"></script>
<script type="text/babel" src="Glossary.jsx"></script>
<script type="text/babel" src="ReadinessCards.jsx"></script>
<script type="text/babel" src="TakePart.jsx"></script>
<script type="text/babel" src="Contact.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="Modal.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <>
      <Nav />
      <Hero />
      <StatStrip />

      <Section
        id="project"
        eyebrow="The Project"
        headline="A Single Day, <em>108 Chortens</em>, A Lasting Sanctuary."
        variant="plain"
      >
        <p>Project 108 is the building of 108 Jangchub Chortens — Stupas of Enlightenment — along the sacred Mau River in Gelephu Mindfulness City. Each will rise 15 metres into the sky, spaced 108 metres apart along a 12-kilometre corridor. The internal structures are being prepared throughout 2026; the external structures will all be raised together on a single day, 1 November 2026.</p>
        <p>The initiative is undertaken by the Royal Government of Bhutan as a national act of merit, prayer, and collective practice — for the benefit of all sentient beings.</p>
      </Section>

      <Section
        id="chorten"
        eyebrow="The Chorten"
        headline="Three names for one sacred form."
        variant="cream"
      >
        <Glossary />
      </Section>

      <Section
        id="why-108"
        eyebrow="Why 108"
        headline="A number that <em>recurs</em> across the tradition."
        variant="plain"
      >
        <p>108 is a number woven through Buddhist and Vajrayana practice. The mala holds 108 beads, one for each turning of the breath in meditation. The body is mapped at 108 marma points. King Songtsen Gampo is said to have built 108 temples across the Himalayan plateau in a single act of devotion.</p>
        <p>Project 108 takes its place in this lineage — not as repetition, but as <em>resonance</em>. One sacred form, given 108 times.</p>
      </Section>

      <Section
        id="scale"
        eyebrow="Scale"
        headline="<em>Six Readinesses</em> Already in Motion."
        variant="dark"
      >
        <p style={{maxWidth:'40rem'}}>Preparations are already deeply underway. Here is where things stand.</p>
        <ReadinessCards />
      </Section>

      <Section
        id="take-part"
        eyebrow="Take Part"
        headline="<em>Two ways</em> to participate."
        variant="plain"
      >
        <p>This is a collective act of merit. Whether you contribute as a patron of a chorten or join the build with your hands, you are welcome.</p>
        <TakePart />
      </Section>

      <Contact />
      <Footer />
      <Modal />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
